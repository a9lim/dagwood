[project]
# Working name `dagwood` (DAG + layered sandwich). Distribution/import/script all
# `dagwood`/`dag` for now; if the PyPI name collides we follow rlaif's pattern
# (`rlaif-mcp` dist, `rlaif` import) at publish time.
name = "dagwood"
dynamic = ["version"]
description = "A DAG-native task tracker: tasks are nodes, dependencies are edges, with a live web canvas and coding-agent (MCP) integration"
readme = "README.md"
requires-python = ">=3.11"
license = "AGPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "a9lim", email = "mx@a9l.im" }]
keywords = ["dag", "task-tracker", "dependencies", "graph", "mcp", "agent", "svelte"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
    "Typing :: Typed",
]
# The pure engine (core/) has ZERO runtime deps — stdlib tomllib + hand-rolled
# graph algos. The live server (M2) adds starlette/uvicorn/watchfiles; the MCP
# layer (M6) will add `mcp`.
dependencies = [
    "starlette>=0.40",
    "uvicorn[standard]>=0.30",
    "watchfiles>=0.21",
    "mcp>=1.2.0",       # MCP server for coding-agent integration (M6)
    "tomlkit>=0.13",    # round-trip TOML for `dag install codex`
]

[project.urls]
Homepage = "https://github.com/a9lim/dagwood"
Source   = "https://github.com/a9lim/dagwood"
Issues   = "https://github.com/a9lim/dagwood/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",       # required by starlette.testclient
    "pyright>=1.1.409",
    "ruff>=0.6.9",
    "build>=1.0",
    "twine>=5.0",
]

[project.scripts]
dag = "dagwood.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Single source of truth: ``__version__`` in src/dagwood/__init__.py.
[tool.hatch.version]
path = "src/dagwood/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dagwood"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src", "tests"]
extraPaths = ["src"]
strict = ["src/dagwood"]
pythonVersion = "3.11"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
